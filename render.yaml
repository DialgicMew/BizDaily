services:
  - type: web
    name: bizdaily-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT  
        value: "production"
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
